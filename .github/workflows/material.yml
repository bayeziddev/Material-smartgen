name: Deploy Portfolio One Studio

on:
  push:
    branches: ["main"]
    paths:
      - 'protfolio-one/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build bundle
        run: |
          # Ekti clean public deployment folder toiri kora hocche
          mkdir -p public
          
          # protfolio-one folder er vitorer shob assets (index.html, styles.css, runtime, styles, script.js) sorasori public folder e copy kora hocche
          cp -r protfolio-one/* public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4