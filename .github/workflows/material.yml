name: Build and Deploy SmartGen Plugin System

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies with plugins
        run: |
          python -m pip install --upgrade pip
          # Apnar pyproject.toml er full ba required plugins dependencies install kora hocche
          pip install "smartgen-docs[full]"

      - name: Build complete site using SmartGen Engine
        run: |
          # Ekhane root directory theke apnar material config file target kora hocche
          # Jodi config ti protfolio-one folder-er vitor thake, tahole path hobe 'protfolio-one/smartgen-material.yml'
          python -c "from smartgen_docs.core import Builder; Builder(config_path='protfolio-one/smartgen-material.yml', site_dir='site').build()"

      - name: Copy raw theme plugin assets to site
        run: |
          # Eta ensure korbe jate UI/UX, motion, ar runtime files gulo build directory-te thake
          cp -r protfolio-one/runtime site/protfolio-one-runtime || true
          cp -r protfolio-one/styles site/protfolio-one-styles || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4