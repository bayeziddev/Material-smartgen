name: Deploy Portfolio One Exactly

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Structure Directory for Exact HTML Path
        run: |
          # Clean root public folder toiri kora hocche
          mkdir -p public/protfolio-one
          
          # protfolio-one folder er shob assets gulo sothik path-e copy kora hocche
          cp -r protfolio-one/* public/protfolio-one/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4