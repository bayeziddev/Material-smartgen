name: Deploy Portfolio One System

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organize files for GitHub Pages
        run: |
          # Ekta clean public folder toiri kora hocche
          mkdir -p public
          
          # protfolio-one folder-er shob kisu (runtime, styles, index.html) 'protfolio-one' namer subfolder-e rakha hocche
          mkdir -p public/protfolio-one
          cp -r protfolio-one/* public/protfolio-one/
          
          # Jate root URL (https://bayeziddev.github.io/Material-smartgen/) eo error na ase, tai ekta main index redirect ba copy die deya holo
          cp protfolio-one/index.html public/index.html

      - name: Upload artifact
        uses: upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4