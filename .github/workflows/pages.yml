name: Build and deploy SmartGen showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Smartgen
        run: python -m pip install -r requirements.txt
      - name: Build static site
        run: python -m smartgen_showcase.cli build --config smartgen.yml --site-dir site
      - name: Publish Portfolio One plugin preview
        run: |
          mkdir -p site/protfolio-one
          cp -R protfolio-one/. site/protfolio-one/
          cp protfolio-one/index.html site/portfolio-one.html
          test -f site/protfolio-one/index.html
          test -f site/protfolio-one/styles.css
          test -f site/protfolio-one/runtime/effects.js
          echo "Portfolio One preview files:"
          find site/protfolio-one -maxdepth 3 -type f | sort
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
