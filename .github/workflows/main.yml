import os
import json
import yaml
import markdown2
from pathlib import Path

class SmartGenEngine:
    def __init__(self, config_path="smartgen.yml"):
        self.config_path = config_path
        self.config = self.load_config()
        self.site_dir = Path("site")

    def load_config(self):
        """Loads configuration from YAML or JSON format."""
        if Path(self.config_path).exists():
            with open(self.config_path, "r", encoding="utf-8") as f:
                if self.config_path.endswith((".yaml", ".yml")):
                    return yaml.safe_load(f)
                elif self.config_path.endswith(".json"):
                    return json.load(f)
        return {
            "site_name": "SmartGen Showcase",
            "site_description": "Portfolio and Design Showcase by Sayad Md Bayezid Hosan"
        }

    def process_content_files(self, source_dir="."):
        """
        Scans the project directory, removing the strict requirement for a 'docs/' folder.
        Supports parsing of Markdown (.md), HTML (.html), YAML (.yaml/.yml), and JSON (.json) files.
        """
        source_path = Path(source_dir)
        self.site_dir.mkdir(exist_ok=True)

        supported_extensions = {".md", ".html", ".yaml", ".yml", ".json"}
        
        for file_path in source_path.rglob("*"):
            if file_path.is_file() and file_path.suffix in supported_extensions:
                # Skip build outputs and hidden directories
                if "site" in file_path.parts or ".git" in file_path.parts or "__pycache__" in file_path.parts:
                    continue

                relative_path = file_path.relative_to(source_path)
                output_path = self.site_dir / relative_path.with_suffix(".html")
                output_path.parent.mkdir(parents=True, exist_ok=True)

                self.render_file(file_path, output_path)

    def render_file(self, file_path: Path, output_path: Path):
        """Renders file contents based on its format type into valid HTML."""
        ext = file_path.suffix.lower()
        content_html = ""

        with open(file_path, "r", encoding="utf-8") as f:
            raw_data = f.read()

        if ext == ".md":
            content_html = markdown2.markdown(raw_data, extras=["fenced-code-blocks", "tables", "metadata"])
        elif ext == ".html":
            content_html = raw_data
        elif ext in {".yaml", ".yml"}:
            parsed_data = yaml.safe_load(raw_data)
            content_html = f"<pre><code>{json.dumps(parsed_data, indent=2)}</code></pre>"
        elif ext == ".json":
            parsed_data = json.loads(raw_data)
            content_html = f"<pre><code>{json.dumps(parsed_data, indent=2)}</code></pre>"

        # Wrap with basic layout wrapper
        final_html = f"""<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{file_path.stem} - {self.config.get('site_name', 'SmartGen')}</title>
    <link rel="stylesheet" href="assets/css/premium.css">
</head>
<body>
    <main class="content markdown-body">
        {content_html}
    </main>
</body>
</html>"""

        with open(output_path, "w", encoding="utf-8") as out:
            out.write(final_html)

if __name__ == "__main__":
    engine = SmartGenEngine()
    engine.process_content_files()